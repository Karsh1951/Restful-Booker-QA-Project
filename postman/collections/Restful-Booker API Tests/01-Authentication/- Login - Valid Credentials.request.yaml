$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \    \"username\": \"{{username}}\",\r

    \    \"password\": \"{{password}}\"\r

    }"
scripts:
  - type: afterResponse
    code: "// Test 1: Verify Status Code (Area 7 & 8)\r

      pm.test(\"Status code is 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      // Test 2: Dynamic Variable Extraction (Area 9 & 10)\r

      let responseData = pm.response.json();\r

      \r

      pm.test(\"Token is generated and present\", function () {\r

      \    pm.expect(responseData.token).to.be.a(\"string\").and.not.be.empty;\r

      });\r

      \r

      if (responseData.token) {\r

      \    pm.environment.set(\"token\", responseData.token);\r

      }"
    language: text/javascript
settings: {}
order: 1000
